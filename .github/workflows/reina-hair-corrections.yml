name: Reina air strike and kip-up hair
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  reina:
    name: Reina hair registration and native preservation
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install Pillow==13.0.0 numpy==2.2.6
      - run: npm ci --ignore-scripts --prefix tools/fighter-render
      - name: Exact asset and native checks
        env:
          NODE_PATH: ${{ github.workspace }}/tools/fighter-render/node_modules
        run: |
          node tools/qa242/reina396-contract.cjs
          node tests/reina396-native.cjs
      - name: Mirrored native frame registration
        env:
          NODE_PATH: ${{ github.workspace }}/tools/fighter-render/node_modules
        run: node tools/qa242/reina396-hair-audit.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: reina396-hair-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports-reina396/
          retention-days: 30
