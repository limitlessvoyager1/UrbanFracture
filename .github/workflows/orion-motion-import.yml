name: Orion motion import regression
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'source-art/orion384/**'
      - 'tools/orion384/**'
      - 'dist/assets/orion384/motion.webp'
      - 'dist/orion384-data.js'
      - 'dist/orion384.js'
      - 'tests/orion384-import.py'
      - '.github/workflows/orion-motion-import.yml'
permissions:
  contents: read
jobs:
  motion-import:
    name: Orion reviewed motion crops
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install Pillow==13.0.0 numpy==2.2.6
      - name: Original failure fixture and reviewed source rectangles
        run: python tests/orion384-import.py
      - name: Repack from unchanged source and verify reproducibility
        run: |
          python tools/orion384/pack.py --family motion
          python tests/orion384-import.py
          git diff --exit-code -- dist/assets/orion384/motion.webp dist/orion384-data.js reports384/import.json
