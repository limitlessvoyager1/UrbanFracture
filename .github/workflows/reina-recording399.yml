name: Reina costume and grapple recording repair
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  reina399:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.0'
      - run: npm ci --ignore-scripts --prefix tools/fighter-render
      - name: Preserve approved native gameplay and controller paths
        run: |
          node tests/reina399-native-preservation.cjs
          node --test tests/reina390-native.cjs tests/reina395-recovery.cjs tests/reina396-native.cjs tests/gamepad.test.cjs tests/controller157.cjs
      - name: Selected asset integrity
        run: node tools/qa242/reina399-contract.cjs
      - name: Native mirrored recording routes
        env:
          NODE_PATH: ${{ github.workspace }}/tools/fighter-render/node_modules
        run: node tools/qa242/reina399-render-audit.cjs
      - name: Full costume route sampling
        env:
          NODE_PATH: ${{ github.workspace }}/tools/fighter-render/node_modules
        run: node tools/reina-royal-uniform/verify.cjs reports-reina399/costume-native.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: reina399-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports-reina399/
          retention-days: 30
