name: Reina armed and published continuity
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
jobs:
  reina:
    name: Reina armed gait, visible knife and published hook direction
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - run: python -m pip install Pillow==13.0.0 numpy==2.2.6
      - run: npm ci --ignore-scripts --prefix tools/fighter-render
      - name: Native input, render registration and preservation
        env:
          NODE_PATH: ${{ github.workspace }}/tools/fighter-render/node_modules
        run: |
          node --test tests/reina390-input.cjs tests/reina390-native.cjs tests/reina390-view.cjs tests/reina389-input.cjs tests/reina389-view.cjs tests/reina389-preservation.cjs tests/orion388-weapon-aim.cjs tests/orion387-hit-registration.cjs tests/orion386-counters.cjs tests/orion385-locomotion.cjs
          python tests/reina389-art.py
          python tests/reina390-art.py
          node tests/weapons249.cjs
          node tests/weapons249-view.cjs
          node tests/gamepad.test.cjs
          node tests/controller157.cjs
      - name: Source-bound full-art native render
        env:
          NODE_PATH: ${{ github.workspace }}/tools/fighter-render/node_modules
        run: |
          node tools/qa242/reina393-render-audit.cjs
          node tools/qa242/reina392-render-audit.cjs
          node tools/qa242/reina390-render-audit.cjs
          node tools/qa242/reina389-render-audit.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() }}
        with:
          name: reina393-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports389/
            reports390/
            reports392/
            reports393/
          retention-days: 30
