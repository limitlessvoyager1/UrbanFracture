(async()=>{const d=new DOMParser().parseFromString(await(await fetch('index.html')).text(),'text/html');const scripts=[...d.querySelectorAll('script[src]')].map(e=>e.getAttribute('src'));for(const s of d.querySelectorAll('script'))s.remove();document.head.innerHTML=d.head.innerHTML;document.body.innerHTML="<aside style=\"padding:16px;background:#122333;position:sticky;top:0;z-index:100;font:14px system-ui\"><strong>Rooftop ending \u00b7 developer inspection</strong> <select id=\"roofHeroLab201\" aria-label=\"Inspector hero\"><option value=\"reina\">Reina</option><option value=\"broxton\">Broxton</option><option value=\"nova\">Nova</option><option value=\"forest\">Forest</option><option value=\"niko\">Niko</option></select> <button id=\"roofStartLab201\">Start rooftop</button> <select id=\"roofPhaseLab201\" aria-label=\"Cinematic phase\"><option>approach</option><option>surprise</option><option>rush</option><option>knockout</option><option>board</option><option>startup</option><option>lift</option><option>depart</option><option>choice</option></select> <button id=\"roofStageLab201\">Show phase</button> <button id=\"roofStepLab201\">Advance half second</button> <button id=\"roofNightLab201\">Night rain</button><pre id=\"roofDiagLab201\" style=\"margin:4px\"></pre></aside>"+d.body.innerHTML;for(const src of [...scripts,'rooftop-lab201.js?v=201.2'])await new Promise((yes,no)=>{const s=document.createElement('script');s.src=src;s.onload=yes;s.onerror=no;document.body.append(s);});})();</script>
