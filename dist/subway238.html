<!doctype html><html><head><meta charset="utf-8"><title>Central Transit · Build238 inspector</title><style>body{background:#0c1727;color:#dce8ed;font:15px monospace;max-width:1100px;margin:24px auto}button,select,input{padding:10px;background:#253f5a;color:white;border:1px solid #698ba5;margin:5px}canvas{width:100%;image-rendering:pixelated}p{color:#b2c9da}</style></head><body><h1>CENTRAL TRANSIT · BUILD238</h1><p>Developer-only scenery inspector · passing trains, platform civilians and station sound preview.</p><select id="section"></select><button id="sound">SOUND OFF</button><button id="doors">OPEN TRAIN DOORS</button><label>Camera <input id="camera" type="range" value="0" min="0" max="1"></label><canvas id="view" width="1920" height="1080"></canvas><pre id="state"></pre><script src="review-loader211.js?v=238"></script><script>Review211.ready.then(()=>{const H=Subway238,V=SubwayView238,g=new NeonCombat.Brawler(),cv=document.querySelector('#view'),c=cv.getContext('2d'),sel=document.querySelector('#section'),cam=document.querySelector('#camera');let loaded=false,audio=null,sound=false,previous=0;H.levels.forEach((d,k)=>{const o=document.createElement('option');o.value=k;o.textContent=d.name;sel.append(o)});function load(k){H.start(g,k);g.pending=[];g.enemies=[];g.camera=0;cam.max=g.zoneDefinition.end-960;cam.value=0;}sel.onchange=()=>load(+sel.value);cam.oninput=()=>g.camera=+cam.value;document.querySelector('#doors').onclick=()=>{sel.value=2;load(2);g.camera=g.zoneDefinition.end-960;cam.value=g.camera;g.subway238.doorOpen=true;g.subway238.boardAt=g.time;};document.querySelector('#sound').onclick=()=>{if(!audio)audio=new AudioContext();audio.resume();sound=!sound;document.querySelector('#sound').textContent=sound?'SOUND ON':'SOUND OFF';};function render(t){const dt=Math.min(.04,(t-previous)/1000||0);previous=t;if(loaded){g.time+=dt;c.setTransform(2,0,0,2,0,0);c.imageSmoothingEnabled=false;c.fillStyle='#16252e';c.fillRect(0,0,960,540);V.scene(c,g);V.people(c,g);c.save();c.translate(g.player.x-g.camera,g.player.y);c.scale(NeonCombat.Forest125.scale(g.player),NeonCombat.Forest125.scale(g.player));PolishedSprites.draw(c,g.player,g.time);c.restore();V.foreground(c,g);SubwayAudio238.update(audio,g,sound);document.querySelector('#state').textContent=H.status(g)+'\n'+JSON.stringify({camera:g.camera,section:H.section(g),audio:SubwayAudio238.active,train:H.trainState(g)},null,2);}requestAnimationFrame(render);}Promise.all([PolishedSprites.ready,V.ready,NeonUptown.ready]).then(()=>{loaded=true;load(0)});requestAnimationFrame(render);}).catch(e=>{document.querySelector('#state').textContent='Inspector load error: '+e.stack;});</script></body></html>
