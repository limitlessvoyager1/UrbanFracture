<!doctype html><meta charset="utf-8"><title>Chemical214 review</title><style>body{background:#14232c;color:#eee;font:16px system-ui;margin:20px}button,input,select{padding:8px;margin:5px}canvas{width:min(100%,1200px);display:block}pre{white-space:pre-wrap}</style><h1>Ethan & Nora — chemical vulnerability review</h1><label>Hero<select id="hero"><option>reina</option><option>broxton</option><option>nova</option><option>forest</option><option>niko</option><option>orion</option></select></label><label>Effect<select id="effect"><option value="nora">Sticky</option><option value="ethan">Acid</option><option value="both">Acid + Sticky</option></select></label><label>Frame<input id="frame" type="number" value="84" min="0" max="600"></label><label><input id="block" type="checkbox" checked>Hold Block</label><button id="stage">Stage</button><button id="step">Step</button><button id="play">Play / pause</button><canvas width="1920" height="1080"></canvas><pre id="report">Loading…</pre><script src="review-loader211.js?v=214"></script><script>
(async()=>{await Review211.ready;await PolishedSprites.ready;const N=NeonCombat,H=N.Chemical214,c=document.querySelector('canvas').getContext('2d'),el=id=>document.getElementById(id);let g,paused=true,last=0;function tick(){g.tick(1/60,{block:el('block').checked});}function stage(){g=new N.Brawler();g.selectHero(el('hero').value);g.startUptown(5);g.pending=[];g.enemies=[];g.props=[];g.reinforce=()=>{};g.ai=()=>{};g.player.x=g.zoneDefinition.start+750;g.player.y=480;g.player.dir=1;g.player.inv=g.player.wakeInv=0;g.camera=g.player.x-450;g.lab166={puddles:[],flasks:[],serial:2};const kinds=el('effect').value==='both'?['ethan','nora']:[el('effect').value];for(const [i,v]of kinds.entries())g.lab166.puddles.push({id:i+1,variant:v,x:g.player.x,y:480,age:0,tick:0});for(let i=0;i<+el('frame').value;i++)tick();paused=true;}el('stage').onclick=stage;el('step').onclick=tick;el('play').onclick=()=>paused=!paused;stage();function render(t){if(!paused&&t-last>15){tick();last=t;}c.setTransform(2,0,0,2,0,0);c.fillStyle='#263c46';c.fillRect(0,0,960,540);c.fillStyle='#575b55';c.fillRect(0,410,960,130);c.strokeStyle='#a6ae9c';c.beginPath();c.moveTo(0,480);c.lineTo(960,480);c.stroke();for(const q of g.lab166.puddles){c.fillStyle=q.variant==='ethan'?'#80cd4588':'#d7bd6988';c.beginPath();c.ellipse(q.x-g.camera,q.y,100,27,0,0,Math.PI*2);c.fill();}const p=g.player,S=N.Forest125.scale(p);c.save();c.translate(p.x-g.camera,p.y);c.scale(p.dir*S,S);PolishedSprites.draw(c,p,g.time);c.restore();c.fillStyle='#edecc7';c.font='bold 20px monospace';c.fillText(p.type.toUpperCase()+' — '+H.debug(g).stage.toUpperCase(),35,55);c.font='16px monospace';c.fillText('25% acid / 40% restraint: decision weights only',35,85);el('report').textContent=JSON.stringify(H.debug(g),null,2);requestAnimationFrame(render);}requestAnimationFrame(render);})();</script>
