<!doctype html><meta charset="utf-8"><title>Urban Fracture encounter diagnostics</title><style>body{background:#101b28;color:#e7edf5;font:16px system-ui;margin:24px}button,select{font:inherit;padding:10px;margin:4px}canvas{width:min(100%,960px);display:block;border:1px solid #617486}pre{white-space:pre-wrap;max-width:1000px}</style><h1>Encounter controller diagnostics · Build 222</h1><p>Production simulation with schematic arena markers. This developer view does not replace game artwork.</p><label>Section <select id="scene"><option value="downtown">Downtown pilot</option><option value="bank">Bank / Otis</option><option value="river">Riverfront / Sterling guards</option><option value="tavern">Tavern Aidans</option><option value="colt">Colt route</option></select></label><button id="load">Load section</button><button id="step">Advance one second</button><button id="right">Walk forward five seconds</button><button id="clear">Defeat current enemies</button><button id="outside">Knock enemy beyond arena</button><canvas width="960" height="310"></canvas><pre id="status">Loading simulation…</pre><script>
(async()=>{const d=new DOMParser().parseFromString(await(await fetch('index.html')).text(),'text/html'),files=[...d.querySelectorAll('script[src]')].map(e=>e.getAttribute('src'));for(const src of files.slice(0,files.findIndex(s=>s.startsWith('encounter-config222.js'))+1).filter(s=>!s.includes('view'))){await new Promise((resolve,reject)=>{const s=document.createElement('script');s.src=src;s.onload=resolve;s.onerror=reject;document.body.append(s);});}const N=NeonCombat,A=N.Adaptive222,L=N.LockedBattles222,c=document.querySelector('canvas').getContext('2d'),el=id=>document.getElementById(id);let g;function show(){c.fillStyle='#192b3c';c.fillRect(0,0,960,310);const a=L.active(g);c.fillStyle='#334a58';c.fillRect(24,130,912,130);c.strokeStyle='#f4cd60';c.lineWidth=3;c.strokeRect(24,130,912,130);c.font='15px monospace';c.fillStyle='#fff0a2';c.fillText(a?'LOCKED ARENA · CAMERA '+g.camera.toFixed(0):'FREE MOVEMENT · CAMERA '+g.camera.toFixed(0),24,40);for(const e of[g.player,...g.enemies]){if(e!==g.player&&e.hp<=0)continue;const x=e.x-g.camera;c.fillStyle=e===g.player?'#8adcf9':e.dormant?'#657082':'#ee9c70';c.fillRect(x-12,190+(e.y-470)*1.2,24,32);c.fillText(e===g.player?'HERO':e.name,x-25,182+(e.y-470)*1.2);}el('status').textContent=JSON.stringify({section:g.zoneDefinition.name,HP:g.player.hp,remaining:g.enemiesRemaining,GO:g.zoneClear,transition:!!g.transition,encounters:L.debug(g)},null,2);}function step(seconds=1,input={}){for(let i=0;i<seconds*60;i++)g.tick(1/60,input);show();}function load(){g=new N.Brawler();g.selectHero('reina');const s=el('scene').value;if(s==='downtown')g.reset(0);else if(s==='bank')g.reset(10);else if(s==='river')g.startUptown(7);else N.Slums202.start(g,s==='tavern'?20:22);g.player.hp=g.player.maxHp=10000;step(1/60);}el('load').onclick=load;el('step').onclick=()=>step();el('right').onclick=()=>step(5,g.zoneDefinition.reverse&&!g.hotelRoute?{left:true}:{right:true});el('clear').onclick=()=>{for(const e of g.enemies)if(e.hp>0&&!e.dormant){e.inv=0;g.damage(e,99999,1,true,{attacker:g.player,force:true});}step(2);};el('outside').onclick=()=>{const e=g.enemies.find(e=>e.hp>0&&!e.dormant);if(e){e.x=(L.active(g)?.bounds.max||g.camera+936)+140;g.knockDown(e,1,1.4);show();}};load();})();
</script>
