<!doctype html><meta charset="utf-8"><title>Build241 stabilization inspector</title><style>body{background:#101c26;color:#d9e8ed;font:14px monospace;max-width:1100px;margin:20px auto}select,input,button{padding:10px;background:#24415a;color:white;margin:5px}canvas{width:100%;image-rendering:pixelated}</style><h1>BUILD241 · STABILIZATION QA</h1><p>Native scene/art/state inspector. Animation runs through the existing game clock.</p><select id="scene"><option value="storage">Storage</option><option value="workroom">Workroom</option><option value="fire">Fire boundary</option><option value="casino">Casino</option><option value="suite">Suite</option></select><label>Camera <input id="camera" type="range" min="0" max="2440" value="0"></label><button id="weather">Toggle snow / clear day</button><canvas width="1920" height="1080" id="view"></canvas><pre id="state"></pre><script src="review-loader211.js?v=241"></script><script>
Review211.ready.then(async()=>{await Promise.all([PolishedSprites.ready,NeonUptown.ready,CasinoView192.ready]);const N=NeonCombat,g=new N.Brawler(),c=document.querySelector('canvas').getContext('2d'),sel=document.querySelector('#scene'),cam=document.querySelector('#camera');let last=0,snow=false;function load(){g.selectHero('broxton');if(['casino','suite'].includes(sel.value))N.Casino192.start(g,sel.value==='suite'?1:0);else g.startUptown(sel.value==='storage'?5:6);g.pending=[];g.enemies=[];g.reinforce=()=>{};g.ai=()=>{};g.finishFinancialTick=()=>{};g.camera=g.zoneDefinition.start;cam.min=g.zoneDefinition.start;cam.max=g.zoneDefinition.end-960;cam.value=g.camera;g.player.x=g.camera+380;g.player.y=480;g.player.inv=999;if(sel.value==='fire'){N.Lab149.wave(g);g.lab149.remaining=15;}else if(!g.casino192){g.lab149.phase='Initial';const e=N.actor('ethan',g.camera+610,475);e.walk=1;g.enemies=[e];}else{const e=N.Casino192.guard(N.actor('enforcer',650,480));g.enemies=[e];}}sel.onchange=load;cam.oninput=()=>{g.camera=+cam.value;g.player.x=g.camera+380;};document.querySelector('#weather').onclick=()=>{snow=!snow;g.environment156.setOverride({hour:snow?23:12,temperatureF:snow?20:65,weather:snow?'heavySnow':'clear',intensity:.8,cloud:snow?.6:.05});};function actor(f){c.save();c.translate(f.x-g.camera,f.y);const k=N.Forest125.scale(f);c.scale(f.dir*k,k);PolishedSprites.draw(c,f,g.time,k);c.restore();}function frame(t){const dt=Math.min(.04,(t-last)/1000||0);last=t;g.time+=dt;g.environment156.advance(dt);c.setTransform(2,0,0,2,0,0);if(g.casino192){CasinoView192.scene(c,g);for(const q of g.props)CasinoView192.prop(c,g,q);}else NeonUptown.drawWorld(c,g,false);actor(g.player);for(const e of g.enemies){e.walkPhase=((e.walkPhase||0)+dt*1.8)%1;actor(e);}NeonLabView149.hud(c,g);document.querySelector('#state').textContent=JSON.stringify(N.Stabilization241.report(g),null,2);requestAnimationFrame(frame);}load();requestAnimationFrame(frame);}).catch(e=>document.querySelector('#state').textContent=e.stack);</script>
