(async()=>{await Review211.ready;await PolishedSprites.ready;const N=NeonCombat,S=N.Security216,c=document.querySelector('canvas').getContext('2d'),el=id=>document.getElementById(id);let g,paused=true,last=0;function tick(){g.tick(1/60,{block:el('block').checked});g.camera=0;}function stage(){g=new N.Brawler();g.selectHero(el('hero').value);Casino192.start(g,1);g.pending=[];g.enemies=[];g.props=[];g.reinforce=()=>{};g.ai=()=>{};Object.assign(g.player,{x:530,y:480,dir:-1,inv:0,wakeInv:0,hp:10000,maxHp:10000});const e=Casino192.guard(N.actor('enforcer',475,480));Object.assign(e,{activeAt:0,dir:1,cd:0,inv:0});g.enemies=[e];g.camera=0;const n=el('move').value;if(n==='live'){g.player.x=650;g.enemies.push(Object.assign(N.actor('thug',800,490),{activeAt:0,cd:0,dir:-1}));g.ai=N.Brawler.prototype.ai.bind(g);}else{if(n==='uppercut'){g.player.jump=.5;g.time=.3;const a=N.Audit135.init(g);a.airborne135=true;a.airSerial=1;a.airClaim=-1;const d=N.Director148.init(g);d.jumpAt=0;d.airPlan={serial:1,allow:true};}const r=Math.random;if(n==='oneTwo')Math.random=()=>el('follow').checked?0:.99;try{g.enemyAct(e,n,1,.3);}finally{Math.random=r;}}for(let i=0;i<+el('frame').value;i++)tick();paused=true;}el('hit').onclick=()=>{const e=g.enemies.find(S.is);if(e){e.inv=0;g.damage(e,3,-e.dir,false,{attacker:g.player});}};el('stage').onclick=stage;el('step').onclick=tick;el('play').onclick=()=>paused=!paused;stage();function render(t){if(!paused&&t-last>15){tick();last=t;}c.setTransform(2,0,0,2,0,0);c.fillStyle='#2c343e';c.fillRect(0,0,960,540);c.fillStyle='#72635c';c.fillRect(0,410,960,130);c.strokeStyle='#d8c58e';c.beginPath();c.moveTo(0,480);c.lineTo(960,480);c.stroke();for(const p of[g.player,...g.enemies].sort((a,b)=>a.y-b.y)){const scale=N.Forest125.scale(p),pv=p.pairVisual,f=p.flight,u=f?Math.min(1,f.t/f.total):0,z=f?(f.startZ||0)*(1-u)+Math.sin(u*Math.PI)*(f.arc||0):p.grappleZ||0;c.save();c.translate(pv?pv.cx:p.x,pv?pv.cy:p.y-z);const dir=pv?.sourceDir||p.dir;c.scale(dir*scale,scale);if(pv
