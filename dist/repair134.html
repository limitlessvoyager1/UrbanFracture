<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Combat repair — Developer Inspector</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1420;color:#e5eef5;font:14px system-ui}main{max-width:1120px;margin:24px auto;padding:0 16px}a{color:#79dfd0}h1{font-size:26px;margin-bottom:8px}.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:16px 0}label{display:grid;gap:5px;font-size:12px}button,select{background:#1e3546;color:#eaf6ff;border:1px solid #52808b;border-radius:5px;padding:10px;font:inherit}button{cursor:pointer}button:hover{background:#2b4e60}canvas{display:block;width:100%;border:1px solid #3c576b;background:#14212b}pre{white-space:pre-wrap;background:#142333;padding:16px;line-height:1.6}.small{color:#adc2cf;font-size:12px}input[type=range]{width:240px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:640px){.stats{grid-template-columns:1fr}}</style><main><a href="index.html">← Back to game</a><h1>Combat repair inspector</h1><p class="small">Developer view · actual combat simulation · J / gamepad Attack holds, release executes · no hardware controller is required for the scripted tests.</p><div class="controls"><label>Hero<select id="hero"><option value="reina">Reina</option><option value="nova">Nova</option><option value="broxton">Broxton</option><option value="forest">Forest</option></select></label><label>Opponent<select id="enemy"><option value="thug">Marcus</option><option value="knifeThug">Kevin</option><option value="enforcer">Bruno</option><option value="cop">Carmen</option><option value="boss">Jackal</option><option value="none">No target</option></select></label><label>Defense<select id="defense"><option value="none">Normal</option><option value="guard">Guard</option><option value="breakable">Breakable armor</option><option value="unbreakable">Unbreakable armor</option></select></label><label>Facing<select id="dir"><option value="1">Right</option><option value="-1">Left</option></select></label><label>Playback<select id="speed"><option value="1">100%</option><option value=".5">50%</option><option value=".25">25%</option></select></label><button id="reset">Reset</button><button id="audio">Sound off</button></div><div class="controls"><label>Repair move<select id="repairMove"><option value="combo">Reina four-hit combo</option><option value="grab">Forest front shoulders</option><option value="knife">Forest knife opener</option><option value="blitz">Forest coordinated blitz</option><option value="maul">Gunner Maul</option><option value="walk">Gunner loose-leash gait</option></select></label><button id="repairRun">Play repair move</button><label>Move frame<input type="range" id="repairFrame" min="0" max="90" value="0"></label></div><canvas id="preview" width="960" height="540" aria-label="Charge and Tornado combat preview"></canvas><div class="controls"><button id="press">Press Attack</button><button id="release">Release Attack</button><label>Hold duration<select id="duration"><option>1</option><option>2</option><option>2.9</option><option selected>3</option><option>3.5</option><option>5</option></select></label><button id="test">Test hold & release</button><button id="pause">Pause</button><button id="step">Step 1 frame</button><button id="dog">Stun Gunner</button><button id="jump">Cancel with jump</button></div><div class="controls"><label>Tornado frame<input id="frame" type="range" min="0" max="62" step="1" value="0"></label><label><input id="anchors" type="checkbox" checked>Show striking foot / hurtbox</label><label>Counter<select id="counter"><option value="punch">Neutral punch → hip toss</option><option value="punchForward">Forward punch → combo</option><option value="kick">Neutral kick → rear grab</option><option value="kickForward">Forward kick → forearm</option></select></label><button id="counterTest">Run Reina counter</button><button id="guardDemo">Bruno block pose</button><button id="shockDemo">Nova electrical recoil</button></div><div class="stats"><pre id="debug" aria-live="polite"></pre><pre id="checks"></pre></div></main><script src="review-loader211.js?v=211"></script><script>Review211.ready.then(async()=>{
'use strict';const $=s=>document.querySelector(s),N=NeonCombat,canvas=$('#preview'),c=canvas.getContext('2d');let repairDemo=null,repairWalking=false;let g,p,e,down=false,paused=false,automate=null,last=0,acc=0,sound=false,audio=null,readies=0,releases=0,impacts=0,latest=null;const reader=new NeonGamepad.Reader();
function reset(){g=new N.Brawler();g.selectHero($('#hero').value);g.startUptown('mall');g.pending=[];g.props=[];g.items=[];g.enemies=[];g.uptownPeds=[];g.ai=()=>{};g.reinforce=()=>{};g.camera=7200;p=g.player;p.x=p.prevX=7550;p.y=p.prevY=475;p.dir=Number($('#dir').value);p.inv=0;N.Forest125.makeDog(g);e=null;const type=$('#enemy').value;if(type!=='none'){e=N.actor(type,p.x+p.dir*135,p.y);e.hp=e.maxHp=1000;e.dir=-p.dir;e.cd=999;e.inv=e.wakeInv=0;g.enemies=[e];if($('#defense').value==='guard')e.guarding=99;if(['breakable','unbreakable'].includes($('#defense').value))e.act={name:'hook',t:0,total:999,hitAt:999,armorClass:$('#defense').value};}down=false;paused=false;automate=null;repairDemo=null;repairWalking=false;readies=releases=impacts=0;latest=null;$('#pause').textContent='Pause';render();}
function edge(value){down=value;g.attackInput(value,{});consume();render();}
function tone(hz,d=.12){if(!sound)return;audio??=new AudioContext();audio.resume();const o=audio.createOscillator(),a=audio.createGain();o.frequency.value=hz;a.gain.setValueAtTime(.035,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.connect(a).connect(audio.destination);o.start();o.stop(audio.currentTime+d);}
function consume(){for(const ev of g.drainEvents()){if(ev.type==='chargeReady130'){readies++;tone({reina:880,nova:590,broxton:130,forest:520}[ev.hero]);}if(ev.type==='chargeRelease130'){releases++;tone(210);}if(ev.type==='tornadoImpact130'){impacts++;tone(70,.16);}if(ev.type==='parry')tone(980);}}
function tick(dt){if(repairDemo==='combo'&&p.act?.reina134&&p.act.combo<4&&p.act.t*60>=NeonCombat.Combat134.config.reina.hit[p.act.combo-1]&&!p.act.queue134){g.attackInput(true);g.attackInput(false);}g.tick(dt,{attack:down,right:repairWalking});if(p.act?.tornado130)latest=p.act;consume();if(automate&&g.chargeClock130+1e-7>=automate){automate=null;edge(false);}render();}
function actor(f){const S=N.Forest125.scale(f),z=f.grappleZ||f.z||0;const pv=f.pairVisual;c.save();c.fillStyle='#07111d66';c.beginPath();c.ellipse(f.x-g.camera,f.y+2,24*S,5,0,0,7);c.fill();c.translate(pv?pv.cx-g.camera:f.x-g.camera,pv?pv.cy:f.y-z);c.scale((pv?.sourceDir||f.dir)*S,S);if(pv){c.rotate(pv.angle*(pv.sourceDir||f.dir));c.translate(0,pv.pivot||0);}PolishedSprites.draw(c,{...f,grounded114:!!f.down&&!pv&&!f.flight&&!f.heldBy},g.time,S);c.restore();}
function render(){if(!g)return;c.clearRect(0,0,960,540);NeonUptown.drawWorld(c,g,true);NeonChargeView130.effects(c,g,true);for(const f of [p,...g.enemies,...(g.gunner125?[g.gunner125]:[])].sort((a,b)=>a.y-b.y))actor(f);NeonChargeView130.effects(c,g,true,true);if($('#anchors').checked){const k=p.act?.knife134;if(k){c.strokeStyle=k.active?'#ffb857':'#7591a0';c.lineWidth=4;c.beginPath();c.moveTo(k.blade[0].x-g.camera,k.blade[0].y);c.lineTo(k.blade[1].x-g.camera,k.blade[1].y);c.stroke();for(const z of k.results){const b=z.hurtbox;c.strokeStyle=z.hit?'#8fff98':'#7dc8fa';c.lineWidth=1;c.strokeRect(b.left-g.camera,b.top,b.right-b.left,b.bottom-b.top);}}if(p.shoulder134)for(const h of p.shoulder134.hands){c.fillStyle='#ffe095';c.beginPath();c.arc(h.x-g.camera,h.y,3,0,7);c.fill();}}const a=p.act?.tornado130?p.act:latest;if($('#anchors').checked&&p.act?.tornado130){const foot=p.act.foot130;c.strokeStyle='#78d6f9';c.lineWidth=1;if(e){const s=N.Forest125.scale(e);c.strokeRect(e.x-g.camera-22*s-7,e.y-122*s-7,44*s+14,86*s+14);}c.fillStyle='#fff49c';c.beginPath();c.arc(foot.x-g.camera,foot.y,4,0,7);c.fill();}c.fillStyle='#0b152bd9';c.fillRect(0,0,960,63);c.fillStyle='#e6f5fc';c.font='bold 16px monospace';c.fillText(p.name+' · '+NeonChargeView130.hud(g),20,26);c.font='12px monospace';c.fillText('Health '+Math.ceil(p.hp)+' / '+p.maxHp+' · Target '+(e?e.hp+' / '+e.maxHp:'none'),20,49);const d=N.Charge130.debug(g);$('#debug').textContent=Object.entries(d).map(([k,v])=>k+': '+(typeof v==='number'?v.toFixed(2):v)).join('\n');$('#checks').textContent='Charge-complete cues: '+readies+'\nRelease executions: '+releases+'\nTornado contacts: '+impacts+'\nAnimation frame: '+(p.act?(p.act.t*60).toFixed(1):'—')+'\nKick yaw: '+(a?Math.round(Math.min(360,(p.tornadoPose130?.rotation||Math.PI*2)*180/Math.PI))+'°':'—')+'\nSprite scale: fixed 1.0\nCombat plane: '+p.y+' / '+(e?.y??'—')+'\nCounter grip: '+(p.hold?(p.hold.rear?'rear':'front'):'released')+'\nBlade / contact: '+JSON.stringify(p.act?.knife134||{})+'\nShoulders: '+JSON.stringify(p.shoulder134||{})+'\nGunner: '+(g.gunner125?.ai126?.state||g.gunner125?.state||'—');}
for(const id of ['hero','enemy','defense','dir'])$('#'+id).onchange=reset;$('#reset').onclick=reset;$('#press').onclick=()=>edge(true);$('#release').onclick=()=>edge(false);$('#test').onclick=()=>{reset();edge(true);automate=Number($('#duration').value);};$('#pause').onclick=()=>{paused=!paused;$('#pause').textContent=paused?'Play':'Pause';};$('#step').onclick=()=>{paused=true;$('#pause').textContent='Play';tick(1/60);};$('#dog').onclick=()=>{if(!g.gunner125)return;const s=N.Companion126.init(g);s.stunStart=g.time;s.stunUntil=g.time+5;s.recoverUntil=s.stunUntil+.45;s.state='Stunned';};$('#jump').onclick=()=>{g.command('jump');render();};$('#audio').onclick=()=>{sound=!sound;$('#audio').textContent=sound?'Sound on':'Sound off';tone(520);};$('#anchors').onchange=render;
$('#frame').oninput=()=>{const f=Number($('#frame').value);$('#hero').value='reina';reset();edge(true);for(let i=0;i<180;i++)tick(1/60);edge(false);let n=0;while(p.act?.tornado130&&p.act.t*60<f-1e-6&&n++<200)tick(1/120);paused=true;$('#pause').textContent='Play';render();};
$('#counterTest').onclick=()=>{$('#hero').value='reina';$('#enemy').value='thug';$('#defense').value='none';reset();e.x=p.x+p.dir*80;const kind=$('#counter').value;g.enemyAct(e,kind.startsWith('kick')?'frontKick':'hook',1,.4,{damage:20,reach:130});e.act.t=.32;g.command('counter',kind.includes('Forward')?(p.dir>0?{right:true}:{left:true}):{});};
$('#guardDemo').onclick=()=>{$('#hero').value='nova';$('#enemy').value='enforcer';$('#defense').value='guard';reset();e.x=p.x+p.dir*90;e.guarding=1;e.blockFlash=.2;tick(1/60);paused=true;$('#pause').textContent='Play';};$('#shockDemo').onclick=()=>{$('#hero').value='nova';$('#enemy').value='cop';$('#defense').value='none';reset();p.shock=1;p.stun=1;tick(1/60);paused=true;$('#pause').textContent='Play';};

function repair(f=0,play=true){const kind=$('#repairMove').value;$('#hero').value=kind==='combo'?'reina':'forest';$('#defense').value='none';reset();if(e){e.x=p.x+p.dir*(kind==='combo'?70:kind==='grab'?32:125);e.dir=-p.dir;}if(kind==='grab'&&e)g.acquireGrab(e,false,false,true);else if(kind==='combo'||kind==='knife'){g.attackInput(true);g.attackInput(false);}else if(kind==='walk'){repairWalking=true;}else if(e)N.Forest125.begin(g,kind,kind==='blitz'?72:90,{victim:e});repairDemo=kind;for(let i=0;i<f;i++)tick(1/60);paused=!play;$('#pause').textContent=paused?'Play':'Pause';render();}
$('#repairRun').onclick=()=>repair(0,true);$('#repairFrame').oninput=()=>repair(Number($('#repairFrame').value),false);
addEventListener('keydown',ev=>{if(ev.key.toLowerCase()==='j'&&!ev.repeat&&!['INPUT','SELECT'].includes(ev.target.tagName)){ev.preventDefault();edge(true);}});addEventListener('keyup',ev=>{if(ev.key.toLowerCase()==='j')edge(false);});addEventListener('blur',()=>{g.cancelCharge();down=false;g.attackInput(false);});
function loop(now){const dt=last?Math.min(.2,(now-last)/1000):0;last=now;const state=reader.sample(Array.from(navigator.getGamepads?.()||[]));if(state.pressed.includes('attack'))edge(true);if(state.released.includes('attack'))edge(false);if(!paused){acc+=dt*Number($('#speed').value);let n=0;while(acc>=1/60&&n++<16){tick(1/60);acc-=1/60;}}render();requestAnimationFrame(loop);}
Promise.all([PolishedSprites.ready,NeonUptown.ready]).then(()=>{reset();requestAnimationFrame(loop);});
}).catch(e=>{document.body.append("Inspector load failed: "+e.message);});</script></html>
