<!doctype html><meta charset="utf-8"><title>Carmen - Taser alignment206</title><style>body{background:#101d29;color:#e1e8ed;font:15px system-ui;margin:20px}button,select,input{padding:8px;margin:4px}canvas{display:block;width:min(100%,1200px);margin-top:12px}pre{white-space:pre-wrap}</style><h1>Carmen - measured muzzle and probe alignment</h1><label>Facing<select id="facing"><option value="-1">Left</option><option value="1">Right</option></select></label><label>Frame<input id="frame" type="number" value="32" min="0" max="90" style="width:60px"></label><label><input id="offlane" type="checkbox">Different lane</label><label><input id="interrupt" type="checkbox">Interrupt Carmen</label><button id="stage">Stage shot</button><button id="step">Step frame</button><button id="play">Play / pause</button><canvas width="1920" height="1080"></canvas><pre id="diagnostics">Loading production modules...</pre><script>
(async()=>{const html=await(await fetch('index.html')).text(),doc=new DOMParser().parseFromString(html,'text/html');for(const el of doc.querySelectorAll('script[src]')){const src=el.getAttribute('src');if(src.startsWith('game.js')||src.includes('-ui')||src.startsWith('gamepad.js'))continue;await new Promise((yes,no)=>{const s=document.createElement('script');s.src=src;s.onload=yes;s.onerror=no;document.body.append(s);});}await PolishedSprites.ready;const N=NeonCombat,g=new N.Brawler(),c=document.querySelector('canvas').getContext('2d'),el=id=>document.getElementById(id);let paused=true,last=performance.now(),cop;function tick(){g.tick(1/60,{});g.camera=0;if(el('interrupt').checked&&g.time>.57&&cop.act?.name==='taserShot')g.damage(cop,1,-cop.dir,false,{attacker:g.player,force:true});}function stage(){g.selectHero('reina');Slums202.start(g,19);g.enemies=[];g.pending=[];g.reinforce=()=>{};g.ai=()=>{};g.camera=0;const dir=+el('facing').value;Object.assign(g.player,{x:dir===1?650:300,y:el('offlane').checked?450:480,inv:0,hp:105,dir:-dir});cop=g.spawnFinancialEnemy('cop',480,dir===1?300:650);Object.assign(cop,{dir,entry:null,cd:999,inv:0});g.start(cop,'taserShot',1.18,.43,{damage:23});for(let i=0;i<(+el('frame').value||0);i++)tick();paused=true;}el('stage').onclick=stage;el('step').onclick=tick;el('play').onclick=()=>paused=!paused;stage();function render(now){if(!paused&&now-last>15){tick();last=now;}c.setTransform(2,0,0,2,0,0);c.fillStyle='#243745';c.fillRect(0,0,960,540);c.fillStyle='#4b5152';c.fillRect(0,430,960,110);c.strokeStyle='#92a7aa';for(const y of[450,480]){c.beginPath();c.moveTo(0,y);c.lineTo(960,y);c.stroke();}for(const k of g.projectiles)N.Taser206.draw(c,g,k);for(const e of[g.player,cop].sort((a,b)=>a.y-b.y)){c.save();c.translate(e.x-g.camera,e.y);c.scale(e.dir*N.Forest125.scale(e),N.Forest125.scale(e));PolishedSprites.draw(c,e,g.time);c.restore();}c.fillStyle='#e8ddbc';c.font='bold 17px monospace';c.fillText('CARMEN / ACTUAL SPRITES + PROJECTILE SIMULATIO
