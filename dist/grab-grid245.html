<!doctype html><meta charset="utf-8"><title>Grab245 all-enemy rendering QA</title><style>body{background:#101922;color:#ddd;font:14px system-ui}canvas{width:100%;image-rendering:pixelated}button,select{padding:8px}pre{white-space:pre-wrap}</style><h1>All six heroes / native enemy held and recoil rendering</h1><p>Candidate evidence. Each row: enemy ID and front/rear hold. Left pair held, right pair body-hit recoil. No baseline approval.</p><label>Hero <select id="hero"><option>reina</option><option>nova</option><option>broxton</option><option>forest</option><option>niko</option><option>orion</option></select></label><button id="capture">Download canvas</button><canvas width="2560" height="2400"></canvas><pre id="report">Loading…</pre><script src="review-loader211.js?v=245"></script><script>
Review211.ready.then(async()=>{await PolishedSprites.ready;const N=NeonCombat,c=document.querySelector('canvas').getContext('2d'),sel=document.querySelector('#hero'),types=['thug','knifeThug','biker','cop','flint','sato','akari','robber','ethan','nora','enforcer','security','dorian','bouncer','boss','gangster'];function actor(f){c.save();c.translate(f.x,f.y);c.scale(f.dir,f.dir?1:1);PolishedSprites.draw(c,f,30,1);c.restore();}function render(){c.setTransform(1,0,0,1,0,0);c.imageSmoothingEnabled=false;c.fillStyle='#15242e';c.fillRect(0,0,2560,2400);const rows=[];for(let i=0;i<32;i++){const type=types[Math.floor(i/2)],rear=!!(i%2),x=(i%4)*640,y=Math.floor(i/4)*300;c.fillStyle='#d9e4e3';c.font='16px monospace';c.fillText(type+' / '+(rear?'REAR':'FRONT'),x+18,y+27);c.fillStyle='#72828b';c.fillRect(x+8,y+260,620,2);for(let hit=0;hit<2;hit++){const owner=N.actor(sel.value,x+80+hit*300,y+260),e=N.actor(type,x+118+hit*300,y+260);owner.dir=1;owner.hold={victim:e,rear};e.heldBy=owner;e.dir=rear?1:-1;e.hitFlash=hit?.12:0;actor(e);actor(owner);rows.push({hero:sel.value,type,rear,recoil:!!hit,visual:e.grabVisual245||null});}}document.querySelector('#report').textContent=JSON.stringify({ready:true,count:rows.length,rows},null,2);}sel.onchange=render;document.querySelector('#capture').onclick=()=>{const a=document.createElement('a');a.download='grab-grid245-'+sel.value+'.png';a.href=document.querySelector('canvas').toDataURL();a.click();};render();}).catch(e=>document.querySelector('#report').textContent=e.stack);
</script>
