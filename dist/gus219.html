(async()=>{await Review211.ready;await PolishedSprites.ready;const N=NeonCombat,S=N.Gus219,c=document.querySelector('canvas').getContext('2d'),el=id=>document.getElementById(id);let g,paused=true,last=0;function tick(){g.tick(1/60,{block:el('block').checked});g.camera=0;}function stage(){g=new N.Brawler();g.selectHero(el('hero').value);Route74197.start(g,1);g.pending=[];g.enemies=[];g.props=[];g.reinforce=()=>{};g.ai=()=>{};Object.assign(g.player,{x:520,y:480,dir:-1,inv:0,wakeInv:0,hp:10000,maxHp:10000});const e=Route74197.truck(N.actor('enforcer',450,480),'gus');Object.assign(e,{activeAt:0,dir:1,cd:0,inv:0});g.enemies=[e];g.camera=0;const n=el('move').value;if(n==='live'){g.player.x=650;g.enemies.push(Object.assign(N.actor('thug',800,490),{activeAt:0,cd:0,dir:-1}));g.ai=N.Brawler.prototype.ai.bind(g);}else{if(n==='air'){g.player.jump=.65;g.player.jumpVx=-80;g.time=.3;const a=N.Audit135.init(g);a.airborne135=true;a.airSerial=1;a.airClaim=-1;const d=N.Director148.init(g);d.jumpAt=0;d.airPlan={serial:1,allow:true};}if(el('mirror').checked){e.dir=-1;g.player.x=e.x-70;g.player.dir=1;if(n==='air')g.player.jumpVx=80;}if(n==='stomp'){g.player.x=e.x+e.dir*45;g.player.downTotal=3;g.player.downAge=.4;g.player.down=2.6;g.player.fallFrom=g.player.fallTo=g.player.x;}if(n==='punch'||n==='kick'){e.weapon=null;S.lostWeapon(g,e);}if(n==='heal'){e.hp=20;S.state(e).healDecision=true;S.heal(g,e);}else S.begin(g,e,n);}for(let i=0;i<+el('frame').value;i++)tick();paused=true;}el('hit').onclick=()=>{const e=g.enemies.find(S.is);if(e){e.inv=0;g.damage(e,3,-e.dir,false,{attacker:g.player});}};el('rear').onclick=()=>{const e=g.enemies.find(S.is);const x=g.player.x;g.player.x=e.x-e.dir*45;e.inv=0;g.damage(e,3,e.dir,false,{attacker:g.player});g.player.x=x;};el('disarm').onclick=()=>{const e=g.enemies.find(S.is);e.weapon=null;e.disarmed=true;S.lostWeapon(g,e);};el('stage').onclick=stage;el('step').onclick=tick;el('play').onclick=()=>paused=!paused;stage();function render(t){if(!paused&&t-last>15
